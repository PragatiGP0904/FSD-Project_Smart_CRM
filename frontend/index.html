<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart CRM</title>
    <meta name="description" content="Know what to say before you call. A calm CRM for small businesses." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const stored = localStorage.getItem('smartcrm_theme') || 'system';
        const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
